name: Foundation Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Install headless client runtime
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth libgl1-mesa-dri libflite1

      - name: Enable scripts
        run: chmod +x gradlew .ci/*.sh

      - name: Build and run unit/property/architecture tests
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Verify generated schema reference and editor metadata
        run: ./gradlew --no-daemon --stacktrace verifySchemaArtifacts

      - name: Run NeoForge GameTests
        run: ./gradlew --no-daemon --stacktrace runGameTestServer

      - name: Smoke-test a dedicated server without optional mods
        run: .ci/smoke-server.sh

      - name: Smoke-test the client through its title screen
        run: .ci/smoke-client.sh

      - name: Verify the release JAR excludes test fixtures
        run: .ci/verify-release-jar.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-evidence
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/**
            build/test-results/**
            run/*/logs/**
