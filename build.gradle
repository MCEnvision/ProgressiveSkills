plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest
}

sourceSets.gameTest {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

abstract class DecodeBase64File extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getEncodedFile()

    @OutputFile
    abstract RegularFileProperty getDecodedFile()

    @TaskAction
    void decode() {
        def encoded = encodedFile.get().asFile.getText('UTF-8').replaceAll('\\s', '')
        def output = decodedFile.get().asFile
        output.parentFile.mkdirs()
        output.bytes = Base64.decoder.decode(encoded)
    }
}

abstract class WriteTextFile extends DefaultTask {
    @OutputFile
    abstract RegularFileProperty getOutputFile()

    @Input
    abstract Property<String> getContents()

    @TaskAction
    void writeFile() {
        def output = outputFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(contents.get(), 'UTF-8')
    }
}

abstract class RequireFiles extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getRequiredFiles()

    @TaskAction
    void verifyFilesExist() {
        if (requiredFiles.files.isEmpty()) {
            throw new GradleException("${path} requires at least one test source file")
        }
    }
}

abstract class VerifyTextFileContains extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getTextFile()

    @Input
    abstract Property<String> getRequiredText()

    @TaskAction
    void verifyText() {
        def contents = textFile.get().asFile.getText('UTF-8')
        if (!contents.contains(requiredText.get())) {
            throw new GradleException(
                    "${textFile.get().asFile} does not contain the required success marker: ${requiredText.get()}"
            )
        }
    }
}

abstract class VerifyTextFileExcludes extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getTextFile()

    @Input
    abstract Property<String> getForbiddenPattern()

    @TaskAction
    void verifyText() {
        def contents = textFile.get().asFile.getText('UTF-8')
        if (java.util.regex.Pattern.compile(forbiddenPattern.get()).matcher(contents).find()) {
            throw new GradleException(
                    "${textFile.get().asFile} contains a forbidden runtime error marker"
            )
        }
    }
}

abstract class VerifyPropertyTestResults extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getResultFiles()

    @Input
    abstract Property<Integer> getMinimumTries()

    @TaskAction
    void verifyResults() {
        int tries = 0
        def pattern = java.util.regex.Pattern.compile('(?m)^tries =\\s+([0-9]+)')
        resultFiles.files.each { resultFile ->
            def matcher = pattern.matcher(resultFile.getText('UTF-8'))
            while (matcher.find()) {
                tries += Integer.parseInt(matcher.group(1))
            }
        }
        if (tries < minimumTries.get()) {
            throw new GradleException(
                    "Property-test discovery produced ${tries} tries; expected at least ${minimumTries.get()}"
            )
        }
    }
}

abstract class VerifyMatchingDirectory extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getExpectedDirectory()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getActualDirectory()

    @TaskAction
    void verifyDirectoriesMatch() {
        def expectedRoot = expectedDirectory.get().asFile.toPath()
        def actualRoot = actualDirectory.get().asFile.toPath()
        def relativeFiles = { root ->
            def result = []
            java.nio.file.Files.walk(root).withCloseable { paths ->
                paths.filter { java.nio.file.Files.isRegularFile(it) }
                        .forEach { result.add(root.relativize(it).toString().replace('\\', '/')) }
            }
            result.sort()
        }
        def expectedFiles = relativeFiles(expectedRoot)
        def actualFiles = relativeFiles(actualRoot)
        if (expectedFiles != actualFiles) {
            throw new GradleException(
                    "Generated schema artifact files differ. Expected ${expectedFiles}, generated ${actualFiles}"
            )
        }
        expectedFiles.each { relativePath ->
            def expected = expectedRoot.resolve(relativePath)
            def actual = actualRoot.resolve(relativePath)
            if (java.nio.file.Files.mismatch(expected, actual) != -1L) {
                throw new GradleException(
                        "${relativePath} is stale; run ./gradlew generateSchemaArtifacts and commit the result"
                )
            }
        }
    }
}

def generateGameTestStructures = tasks.register('generateGameTestStructures', DecodeBase64File) {
    encodedFile = layout.projectDirectory.file('src/gameTestFixtures/empty.nbt.b64')
    decodedFile = layout.buildDirectory.file("generated/gameTestResources/data/${mod_id}/structure/empty.nbt")
}

sourceSets.gameTest.resources.srcDir(layout.buildDirectory.dir('generated/gameTestResources'))
tasks.named(sourceSets.gameTest.processResourcesTaskName).configure {
    dependsOn(generateGameTestStructures)
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.gameTest)

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    mods {
        // Ordinary runs load only production output.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        // The GameTest run needs its test classes scanned as part of the mod.
        "${mod_id}_gametest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.getByName(project.mod_id)]
        }

        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.getByName(project.mod_id)]
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.getByName("${project.mod_id}_gametest")]
        }

        data {
            data()
            loadedMods = [mods.getByName(project.mod_id)]

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            gameDirectory = project.file("run/${name}")

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    unitTest {
        testedMod = mods.getByName(project.mod_id)
        loadedMods = [mods.getByName(project.mod_id)]
        enable()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    testImplementation(enforcedPlatform("org.junit:junit-bom:${junit_version}"))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.jqwik:jqwik:${jqwik_version}"
    testImplementation("com.tngtech.archunit:archunit-junit5:${archunit_version}") {
        // Minecraft 1.21.1 strictly pins SLF4J 2.0.9; ArchUnit is compatible with that API.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll('-Xlint:all', '-Werror')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'progressiveskills.projectDir', layout.projectDirectory.asFile.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && result.testCount == 0) {
            throw new GradleException('The configured test task did not discover any tests')
        }
    }
}

def verifyTestHarnessSources = tasks.register('verifyTestHarnessSources', RequireFiles) {
    requiredFiles.from(sourceSets.test.allJava)
}
tasks.named('test').configure {
    dependsOn(verifyTestHarnessSources)
}

def verifyPropertyTestResults = tasks.register('verifyPropertyTestResults', VerifyPropertyTestResults) {
    dependsOn(tasks.named('test'))
    resultFiles.from(
            layout.buildDirectory.file(
                    'test-results/test/TEST-com.envisione.progressiveskills.PropertyHarnessTest.xml'
            ),
            layout.buildDirectory.file(
                    'test-results/test/TEST-com.envisione.progressiveskills.common.id.StableIdPropertyTest.xml'
            ),
            layout.buildDirectory.file(
                    'test-results/test/TEST-com.envisione.progressiveskills.common.pack.PackDeterminismPropertyTest.xml'
            ),
            layout.buildDirectory.file(
                    'test-results/test/TEST-com.envisione.progressiveskills.common.expression.NumericExpressionPropertyTest.xml'
            ),
            layout.buildDirectory.file(
                    'test-results/test/TEST-com.envisione.progressiveskills.common.requirement.RequirementPropertyTest.xml'
            )
    )
    minimumTries = 2500
}
tasks.named('check').configure {
    dependsOn(verifyPropertyTestResults)
}

def gameTestLog = layout.projectDirectory.file('run/gameTestServer/logs/latest.log')
def cleanGameTestLog = tasks.register('cleanGameTestLog', Delete) {
    delete(gameTestLog)
}
def cleanGameTestStarterPack = tasks.register('cleanGameTestStarterPack', Delete) {
    delete(layout.projectDirectory.dir(
            'run/gameTestServer/config/progressiveskills/packs/progressiveskills-core'
    ))
}
def prepareGameTestServerProperties = tasks.register('prepareGameTestServerProperties', WriteTextFile) {
    outputFile = layout.projectDirectory.file('run/gameTestServer/server.properties')
    contents = '# Deterministic GameTest server settings\nonline-mode=false\n'
}
def verifyGameTestResults = tasks.register('verifyGameTestResults', VerifyTextFileContains) {
    textFile = gameTestLog
    requiredText = 'All 2 required tests passed :)'
}
def verifyGameTestLogClean = tasks.register('verifyGameTestLogClean', VerifyTextFileExcludes) {
    textFile = gameTestLog
    forbiddenPattern = '(?i)/(?:error|fatal)\\]|exception|crash report'
}
tasks.named('runGameTestServer').configure {
    dependsOn(cleanGameTestLog, cleanGameTestStarterPack, prepareGameTestServerProperties)
    finalizedBy(verifyGameTestResults, verifyGameTestLogClean)
}
verifyGameTestResults.configure {
    mustRunAfter(tasks.named('runGameTestServer'))
}
verifyGameTestLogClean.configure {
    mustRunAfter(tasks.named('runGameTestServer'))
}

tasks.named('check').configure {
    dependsOn(tasks.named('gameTestClasses'))
}

def checkedSchemaArtifacts = layout.projectDirectory.dir('docs/reference')
def generatedSchemaArtifacts = layout.buildDirectory.dir('generated/schema-artifacts')

tasks.register('generateSchemaArtifacts', JavaExec) {
    group = 'documentation'
    description = 'Regenerates checked-in schema reference and editor metadata.'
    dependsOn(tasks.named('classes'))
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.envisione.progressiveskills.common.schema.render.SchemaArtifactGenerator'
    workingDir(layout.buildDirectory.get().asFile)
    args(checkedSchemaArtifacts.asFile.absolutePath)
    doNotTrackState('This explicit maintenance task rewrites checked-in documentation artifacts.')
}

def cleanGeneratedSchemaArtifacts = tasks.register('cleanGeneratedSchemaArtifacts', Delete) {
    delete(generatedSchemaArtifacts)
}

def generateSchemaArtifactsForVerification = tasks.register('generateSchemaArtifactsForVerification', JavaExec) {
    dependsOn(tasks.named('classes'), cleanGeneratedSchemaArtifacts)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.envisione.progressiveskills.common.schema.render.SchemaArtifactGenerator'
    workingDir(layout.buildDirectory.get().asFile)
    args(generatedSchemaArtifacts.get().asFile.absolutePath)
    outputs.dir(generatedSchemaArtifacts)
}

def verifySchemaArtifacts = tasks.register('verifySchemaArtifacts', VerifyMatchingDirectory) {
    dependsOn(generateSchemaArtifactsForVerification)
    expectedDirectory = checkedSchemaArtifacts
    actualDirectory = generatedSchemaArtifacts
}

tasks.named('check').configure {
    dependsOn(verifySchemaArtifacts)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
