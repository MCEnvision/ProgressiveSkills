schema_version = 2

[skill]
id = "progressiveskills:archery"
display = { key = "skill.progressiveskills.archery", fallback = "Archery" }
description = { key = "skill.progressiveskills.archery.desc", fallback = "Ranged precision and disciplined shooting." }
icon = { type = "item", value = "minecraft:arrow", fallback = "minecraft:barrier", alt = "Archery" }
max_level = 10
enabled = true
overflow = "bank"
negative_xp_policy = "deny"

[curve]
type = "linear"
base = 100
step = 25
rounding = "ceil"

[[level_currency_awards]]
id = "progressiveskills:archery/level_points"
amount_per_level = 2
currency = "progressiveskills:global_points"
award_basis = "lifetime_highest_level"
award_scope = "character"

[[xp_sources]]
id = "progressiveskills:archery/training"
action = "custom"
key = "progressiveskills:archery_training"
amount = 25
repeat_policy = "always"
