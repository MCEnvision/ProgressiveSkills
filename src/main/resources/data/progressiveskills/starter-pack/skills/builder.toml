schema_version = 2

[skill]
id = "progressiveskills:builder"
display = { key = "skill.progressiveskills.builder", fallback = "Builder" }
description = { key = "skill.progressiveskills.builder.desc", fallback = "Construction skill, reach, and structural discipline." }
icon = { type = "item", value = "minecraft:bricks", fallback = "minecraft:barrier", alt = "Builder" }
max_level = 10
enabled = true
overflow = "bank"
negative_xp_policy = "deny"

[curve]
type = "linear"
base = 100
step = 25
rounding = "ceil"

[[level_currency_awards]]
id = "progressiveskills:builder/level_points"
amount_per_level = 2
currency = "progressiveskills:global_points"
award_basis = "lifetime_highest_level"
award_scope = "character"

[[xp_sources]]
id = "progressiveskills:builder/training"
action = "custom"
key = "progressiveskills:builder_training"
amount = 25
repeat_policy = "always"
