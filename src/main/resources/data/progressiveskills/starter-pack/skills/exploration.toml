schema_version = 2

[skill]
id = "progressiveskills:exploration"
display = { key = "skill.progressiveskills.exploration", fallback = "Exploration" }
description = { key = "skill.progressiveskills.exploration.desc", fallback = "Travel, navigation, and frontier knowledge." }
icon = { type = "item", value = "minecraft:compass", fallback = "minecraft:barrier", alt = "Exploration" }
max_level = 10
enabled = true
overflow = "bank"
negative_xp_policy = "deny"

[curve]
type = "linear"
base = 100
step = 25
rounding = "ceil"

[[level_currency_awards]]
id = "progressiveskills:exploration/level_points"
amount_per_level = 2
currency = "progressiveskills:global_points"
award_basis = "lifetime_highest_level"
award_scope = "character"

[[xp_sources]]
id = "progressiveskills:exploration/training"
action = "custom"
key = "progressiveskills:exploration_training"
amount = 25
repeat_policy = "always"
